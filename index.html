<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- WICHTIG für mobile Geräte -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KartoffeIsalat_tv</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://tse1.mm.bing.net/th/id/OIP.tUDa8a3v_KXjBUD3Kc6HtgHaE7?rs=1&pid=ImgDetMain&o=7&rm=3");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            color: white;
            backdrop-filter: blur(4px);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
        }

        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid orange;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
        }

        .username {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            max-width: 300px;
            margin: 10px auto;
            padding: 16px;

            background-color: orange;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            font-size: 16px;
        }

        .button:hover {
            background-color: darkorange;
        }

        /* EXTRA Anpassung für sehr kleine Displays */
        @media (max-width: 400px) {
            img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 20px;
            }

            .button {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/7b7013a5-a73e-4429-b408-574835d3df64-profile_image-70x70.jpeg">

        <h1>KartoffeIsalat_tv</h1>
        <div class="username">@KartoffeIsalat_tv</div>

        <a class="button" href="https://www.twitch.tv/kartoffeisalat_tv" target="_blank">
            <i class="fa-brands fa-twitch"></i> Twitch
        </a>

        <a class="button" href="https://www.tiktok.com/@legolassus" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <a class="button" href="https://discord.gg/Jh97WZ665K" target="_blank">
            <i class="fa-brands fa-discord"></i> Discord
        </a>
    </div>
</body>
</html>
