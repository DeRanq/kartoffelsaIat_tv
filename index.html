<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartoffeIsalat_tv</title>

    <!-- Favicon (optional) -->
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Grundstil */
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://tse1.mm.bing.net/th/id/OIP.tUDa8a3v_KXjBUD3Kc6HtgHaE7?rs=1&pid=ImgDetMain&o=7&rm=3");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            color: white;
            backdrop-filter: blur(4px);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
        }

        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid orange;
            margin-bottom: 15px;
            cursor: pointer; /* klickbar für Bewertung */
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
        }

        .username {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        /* Buttons */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
            padding: 16px;
            background-color: orange;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            font-size: 16px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* Hover nur für Mausgeräte */
        @media (hover: hover) and (pointer: fine) {
            .button:hover {
                transform: scale(1.05); /* Zoom */
                background-color: darkorange;
            }
        }

        /* Kleine Displays */
        @media (max-width: 400px) {
            img {
                width: 120px;
                height: 120px;
            }
            h1 {
                font-size: 20px;
            }
            .button {
                font-size: 15px;
                padding: 14px;
            }
        }

        /* Overlay für Bewertung */
        #ratingOverlay {
            display: none; /* versteckt standardmäßig */
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ratingBox {
            background: white;
            color: black;
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
        }

        .stars {
            display: flex;
            flex-direction: row; /* links-nach-rechts */
            justify-content: center;
        }

        .stars span {
            font-size: 40px;
            cursor: pointer;
            color: lightgray; /* inaktive Sterne */
            transition: color 0.2s;
        }

        /* ausgewählte Sterne orange */
        .stars span.selected {
            color: orange;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Profilbild klickbar -->
        <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/7b7013a5-a73e-4429-b408-574835d3df64-profile_image-70x70.jpeg" id="profilePic" alt="Profilbild">

        <h1>KartoffeIsalat_tv</h1>
        <div class="username">@KartoffeIsalat_tv</div>

        <a class="button" href="https://www.twitch.tv/kartoffeisalat_tv" target="_blank">
            <i class="fa-brands fa-twitch"></i> Twitch
        </a>

        <a class="button" href="https://www.tiktok.com/@legolassus" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <a class="button" href="https://discord.gg/Jh97WZ665K" target="_blank">
            <i class="fa-brands fa-discord"></i> Discord
        </a>
    </div>

    <!-- Overlay für 5-Sterne Bewertung -->
    <div id="ratingOverlay">
        <div class="ratingBox">
            <h2>Bewerte mich!</h2>
            <div class="stars">
                <span data-value="1">&#9733;</span>
                <span data-value="2">&#9733;</span>
                <span data-value="3">&#9733;</span>
                <span data-value="4">&#9733;</span>
                <span data-value="5">&#9733;</span>
            </div>
        </div>
    </div>

    <script>
        const profilePic = document.getElementById('profilePic');
        const overlay = document.getElementById('ratingOverlay');
        const stars = document.querySelectorAll('.stars span');

        // Overlay öffnen beim Klick auf Profilbild
        profilePic.addEventListener('click', () => {
            overlay.style.display = 'flex';
        });

        // Sterne anklickbar machen
        stars.forEach((star, index) => {
            star.addEventListener('mouseover', () => {
                // Hover-Effekt links-nach-rechts
                stars.forEach((s, i) => {
                    s.style.color = i <= index ? 'orange' : 'lightgray';
                });
            });

            star.addEventListener('mouseout', () => {
                // Nach Hover nur ausgewählte Sterne orange
                stars.forEach(s => {
                    if(s.classList.contains('selected')) s.style.color = 'orange';
                    else s.style.color = 'lightgray';
                });
            });

            star.addEventListener('click', () => {
                // Auswahl speichern
                stars.forEach(s => s.classList.remove('selected'));
                for(let i = 0; i <= index; i++){
                    stars[i].classList.add('selected');
                    stars[i].style.color = 'orange';
                }
                alert(`Danke für deine Bewertung: ${index + 1} Sterne!`);
                overlay.style.display = 'none'; // Popup sofort schließen
            });
        });
    </script>
</body>
</html>
